<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国货币流通 · 六层资金流向图</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1220; --panel:#0d1424;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --txt:#e8eefc; --mut:#8b9cb8; --mut2:#64748b;
  --base:#4d8dff; --create:#34d17a; --fiscal:#f5a623; --bond:#a78bfa;
  --shadow:#22d3ee; --cross:#94a3b8; --warn:#ff7a7a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;background:
    radial-gradient(1200px 600px at 30% -10%, #12203a 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 110%, #16112c 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:16px 22px 12px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.3px}
h1 span{color:var(--mut2);font-weight:400}
.h-sub{margin:5px 0 0;font-size:12.5px;color:var(--mut);letter-spacing:.2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:inherit;font-size:12px;color:var(--mut);background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;
  transition:.16s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip:hover{color:var(--txt);border-color:var(--line2);background:rgba(255,255,255,.07)}
.chip.on{color:#0a1020;font-weight:650;border-color:transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.chip[data-k="all"].on{background:#e8eefc}
.chip[data-k="base"].on{background:var(--base);color:#04122e}
.chip[data-k="create"].on{background:var(--create);color:#03150a}
.chip[data-k="fiscal"].on{background:var(--fiscal);color:#1c1200}
.chip[data-k="bond"].on{background:var(--bond);color:#14082e}
.chip[data-k="shadow"].on{background:var(--shadow);color:#00171c}
.chip[data-k="cross"].on{background:var(--cross);color:#0d1520}
/* ---------- main ---------- */
main{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;position:relative}
#canvas{width:100%;height:100%;display:block}
aside{width:392px;flex:none;border-left:1px solid var(--line);background:rgba(8,12,22,.55);
  overflow-y:auto;padding:16px 16px 28px;backdrop-filter:blur(6px)}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
/* ---------- footer ---------- */
footer{flex:none;border-top:1px solid var(--line);background:rgba(8,12,22,.6);padding:10px 18px 12px}
.ops{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.op{font:inherit;font-size:12px;color:var(--mut);background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:6px}
.op:hover{color:var(--txt);background:rgba(255,255,255,.09);border-color:var(--line2);transform:translateY(-1px)}
.op b{font-weight:650;font-size:11px;opacity:.55}
.op[data-tone="up"]:hover{border-color:rgba(52,209,122,.55)}
.op[data-tone="down"]:hover{border-color:rgba(255,122,122,.55)}
.op[data-tone="flat"]:hover{border-color:rgba(167,139,250,.55)}
.mrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.metrics{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.m{min-width:92px;border:1px solid var(--line);border-radius:9px;padding:5px 10px;background:rgba(255,255,255,.025)}
.m .k{font-size:10.5px;color:var(--mut2);letter-spacing:.3px}
.m .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.m .v.up{color:var(--create)} .m .v.down{color:var(--warn)} .m .v.zero{color:var(--mut2)}
.macts{display:flex;gap:8px}
.btn{font:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--txt);transition:.15s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(180deg,#3f7bff,#2f5fe0);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.12)}
.lastop{margin-top:8px;font-size:12px;color:var(--mut);min-height:16px}
.lastop b{color:var(--txt);font-weight:600}
/* ---------- svg ---------- */
.node{cursor:pointer}
.node .card{fill:rgba(255,255,255,.045);stroke:rgba(255,255,255,.12);stroke-width:1.2;
  transition:.18s}
.node:hover .card{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.28)}
.node.dim .card{opacity:.35}
.node.dim text{opacity:.3}
.node.focus .card{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.4);stroke-width:1.6}
.n-title{font-size:24px;font-weight:650;letter-spacing:.5px}
.n-sub{font-size:14px;fill:var(--mut)}
.n-sub2{font-size:13px;fill:var(--mut2)}
.bar{opacity:.9}
.edge .line{fill:none;stroke-width:2.4;stroke-linecap:round;opacity:.62;
  transition:opacity .18s,stroke-width .18s}
.edge .halo{fill:none;stroke:#070b14;stroke-width:10;opacity:.95}
.edge[data-kind="base"]   .line{stroke:var(--base)}
.edge[data-kind="create"] .line{stroke:var(--create)}
.edge[data-kind="fiscal"] .line{stroke:var(--fiscal)}
.edge[data-kind="bond"]   .line{stroke:var(--bond)}
.edge[data-kind="shadow"] .line{stroke:var(--shadow)}
.edge[data-kind="cross"]  .line{stroke:var(--cross)}
.edge[data-kind="base"]   .elabel{fill:#9dc0ff}
.edge[data-kind="create"] .elabel{fill:#7fe0a8}
.edge[data-kind="fiscal"] .elabel{fill:#f7c374}
.edge[data-kind="bond"]   .elabel{fill:#c4b1fb}
.edge[data-kind="shadow"] .elabel{fill:#7fe3f2}
.edge[data-kind="cross"]  .elabel{fill:#b3c1d4}
.elabel{font-size:15px;fill:var(--mut);letter-spacing:.2px;
  paint-order:stroke;stroke:#070b14;stroke-width:4.5px;stroke-linejoin:round;
  transition:opacity .18s,fill .18s}
.elabel.hi{fill:var(--txt)}
.badge circle{transition:opacity .18s}
.badge text{font-size:13px;font-weight:700;fill:#06101f;text-anchor:middle;dominant-baseline:central;
  font-variant-numeric:tabular-nums;transition:opacity .18s}
.dimmed{opacity:.09 !important;pointer-events:none}
.hidden{display:none !important}
.edge.on .line{opacity:1;stroke-width:3.6;stroke-dasharray:12 7;animation:flow .85s linear infinite}
.edge.on .elabel{fill:var(--txt)}
@keyframes flow{to{stroke-dashoffset:-38}}
.node.on .card{fill:rgba(255,255,255,.11);stroke:rgba(255,255,255,.45);stroke-width:1.8}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
/* ---------- panel ---------- */
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:rgba(255,255,255,.028);
  margin-bottom:12px}
.pcard h3{margin:0 0 10px;font-size:14px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.pcard h3 .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#06101f;flex:none}
.pcard p{margin:0 0 9px;font-size:13px;line-height:1.72;color:#c3cfe4}
.pcard p:last-child{margin-bottom:0}
.flowline{font-size:12.5px;color:var(--mut);line-height:1.65;padding-left:14px;position:relative;margin-bottom:6px}
.flowline::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
table.tacc{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:12px}
table.tacc th{color:var(--mut2);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.4px}
table.tacc td{padding:5px 6px;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.05);line-height:1.55}
table.tacc td:first-child{color:var(--mut);white-space:nowrap;width:52px}
table.tacc .pos{color:#8fd8ff} table.tacc .neg{color:#ffb4b4}
.impacts{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
.imp{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid;font-variant-numeric:tabular-nums}
.imp.up{color:#6ee7a8;border-color:rgba(52,209,122,.35);background:rgba(52,209,122,.1)}
.imp.down{color:#ffb0b0;border-color:rgba(255,122,122,.35);background:rgba(255,122,122,.1)}
.imp.flat{color:var(--mut);border-color:var(--line2);background:rgba(255,255,255,.04)}
.one{font-size:13px;line-height:1.75;color:#dfe8f7;border-left:2px solid var(--line2);padding-left:11px;margin-top:11px}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mut)}
.lg i{width:26px;height:0;border-top:3px solid;border-radius:2px;flex:none}
.lg.dash i{border-top-style:dashed}
.kbd{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--mut)}
.backbtn{font:inherit;font-size:11.5px;color:var(--mut);background:none;border:none;cursor:pointer;padding:0 0 10px}
.backbtn:hover{color:var(--txt)}
/* ---------- 工具箱 ---------- */
.tbox{cursor:pointer}
.tbg{transition:.18s}
.tbox:hover .tbg{fill:rgba(77,141,255,.1);stroke:rgba(77,141,255,.55)}
.tbox-t{font-size:14.5px;font-weight:650;fill:var(--txt)}
.tbox-s{font-size:10.5px;fill:var(--mut2)}
.tbox-n{font-size:13px;font-weight:600}
.tbox-g{font-size:10px;fill:var(--mut2)}
.tbox-r{font-size:11px;fill:var(--mut)}
.lad{display:flex;flex-direction:column;gap:7px;margin:8px 0 4px}
.lad-row{display:flex;align-items:center;gap:8px}
.lad-k{width:92px;flex:none;font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.track{position:relative;flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.07)}
.track i{position:absolute;top:0;height:9px;border-radius:5px}
.lad-ax{display:flex;justify-content:space-between;margin-left:100px;font-size:10px;color:var(--mut2);margin-top:3px}
.tool{border-left:2px solid var(--line2);padding:1px 0 1px 10px;margin-bottom:13px}
.tool:last-child{margin-bottom:0}
.tool-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.tool-h b{font-size:12.5px;color:var(--txt);font-weight:650}
.tool-h span{font-size:10.5px;color:var(--mut2);white-space:nowrap}
.tool-r{font-size:12px;color:#c3cfe4;line-height:1.7;margin-top:3px}
.chain{margin:10px 0 2px}
.ch{border-left:2px solid rgba(77,141,255,.45);padding:1px 0 1px 11px}
.ch-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.ch-h b{font-size:13px;color:var(--txt);font-weight:650;letter-spacing:.2px}
.ch-h span{font-size:10.5px;color:var(--mut2)}
.ch-d{font-size:11.5px;color:var(--mut);line-height:1.72}
.ch-ar{display:flex;align-items:center;margin:6px 0 6px 2px;font-size:10.5px;color:var(--mut2)}
.ch-ar::before{content:"↓";color:#6fa4ff;margin-right:6px;font-size:12px;line-height:1}
.tool-dl{margin:0 0 6px}
.tool-dl>div{display:flex;gap:8px;font-size:11px;line-height:1.72}
.tool-dl i{flex:none;width:26px;font-style:normal;color:var(--mut2)}
.tool-dl span{flex:1;color:var(--mut)}
.cp{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.cp:first-child{margin-top:4px;padding-top:0;border-top:none}
.cp-h{margin-bottom:4px}
.cp-h b{font-size:12.5px;color:var(--txt);display:block;margin-bottom:1px}
.cp-h span{font-size:10.5px;color:var(--mut2)}
.cp-d{font-size:11.5px;color:var(--mut);line-height:1.72;margin-bottom:6px}
.cp-r{display:flex;gap:8px;font-size:11px;line-height:1.68;margin-top:3px}
.cp-r i{flex:none;width:88px;font-style:normal;color:#9fb2cc}
.cp-r span{flex:1;color:var(--mut)}
.au{margin-top:12px}
.au:first-child{margin-top:4px}
.au b{font-size:12px;color:var(--txt);display:block;margin-bottom:2px}
.au p{margin:0;font-size:11.5px;color:var(--mut);line-height:1.72}
.deep-p{font-size:12.5px;line-height:1.8;color:#dfe8f7;margin:0 0 11px}
.deep-p:last-child{margin-bottom:0}
.dtab{width:100%;border-collapse:collapse;margin:2px 0 12px;font-size:11px}
.dtab th{text-align:left;color:var(--mut2);font-weight:400;padding:0 0 6px;font-size:10.5px}
.dtab td{vertical-align:top;padding:7px 8px 7px 0;border-top:1px solid rgba(255,255,255,.07);line-height:1.65;color:var(--mut)}
.dtab td:first-child{width:74px}
.dtab td b{display:block;font-size:12px;color:var(--txt);font-weight:650}
.dtab td span{display:block;font-size:10px;color:var(--mut2)}
.keybox{border-left:2px solid var(--base);background:rgba(77,141,255,.075);padding:10px 12px;
  border-radius:0 9px 9px 0;font-size:12px;line-height:1.8;color:#dfe8f7;margin:0 0 12px}
.keybox b{color:#9dc0ff}
.tl{margin:2px 0 12px}
.tl-r{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.tl-r:first-child{border-top:none}
.tl-y{flex:none;width:78px;font-size:10.5px;color:var(--mut2);padding-top:2px}
.tl-b{flex:1}
.tl-b b{display:block;font-size:12px;color:var(--txt);font-weight:650;margin-bottom:1px}
.tl-b em{font-style:normal;font-size:11px;color:var(--mut);line-height:1.68}
.rztree{margin:6px 0 2px}
.rz1{display:flex;align-items:baseline;gap:8px;padding:4px 0 6px}
.rz1 b{font-size:12.5px;color:var(--txt);font-weight:650}
.rz1 span{font-size:10px;color:var(--mut2)}
.rz2,.rz3{display:flex;align-items:baseline;gap:7px;padding:4px 0;margin-left:7px;border-left:1px solid rgba(255,255,255,.12)}
.rz2{padding-left:12px;font-size:11.5px;color:#cfdaeb}
.rz3{padding-left:24px;font-size:11px;color:var(--mut);border-left-color:rgba(255,255,255,.07)}
.rz2 i,.rz3 i{flex:none;width:7px;height:7px;border-radius:2px;transform:translateY(-1px)}
.rz2 em,.rz3 em{font-style:normal;color:var(--mut2);font-size:10.5px;margin-left:2px}
.rz3 b{color:#dfe8f7;font-weight:600;margin-right:2px}
.era{display:flex;gap:11px;padding:14px 0 13px;border-top:1px solid rgba(255,255,255,.07)}
.era:first-child{border-top:none;padding-top:4px}
.era-n{flex:none;width:19px;height:19px;border-radius:50%;background:rgba(77,141,255,.14);
  border:1px solid rgba(77,141,255,.4);color:#9dc0ff;font-size:10px;line-height:17px;text-align:center;margin-top:1px}
.era-b{flex:1;min-width:0}
.era-y{font-size:10.5px;color:var(--mut2);letter-spacing:.3px}
.era-t{font-size:13px;color:var(--txt);font-weight:650;margin:2px 0 5px}
.era-m{font-size:11.5px;color:var(--mut);line-height:1.75}
.era-k{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.era-k span{font-size:10px;color:#9fb2cc;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);border-radius:5px;padding:2px 6px;white-space:nowrap}
.era-w{margin-top:9px;padding-left:9px;border-left:2px solid rgba(245,166,35,.5);
  font-size:10.5px;color:#d8c4a0;line-height:1.68}
.barchart{display:flex;align-items:flex-end;gap:3px;height:118px;margin:8px 0 6px}
.bc-r{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bc-b{display:block;width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#4d8dff,#2b5399)}
.bc-r em{font-style:normal;font-size:8.5px;color:var(--mut2);margin-top:3px;line-height:1}@media (max-width:1080px){
  main{flex-direction:column}
  aside{width:auto;max-height:38vh;border-left:none;border-top:1px solid var(--line)}
  #stage{min-height:52vh}
  html,body{overflow:auto;height:auto}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>中国货币流通 · 六层资金流向图 <span>／ 每根箭头都是一笔记账</span></h1>
    <p class="h-sub">「创造与回笼」决定存量，「周转速度」决定物价 · 点箭头看分录，点方块看角色</p>
  </div>
  <nav class="chips" id="chips"></nav>
</header>

<main>
  <div id="stage"><svg id="canvas" viewBox="0 0 1760 980" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside id="panel"></aside>
</main>

<footer>
  <div class="ops" id="ops"></div>
  <div class="mrow">
    <div class="metrics" id="metrics"></div>
    <div class="macts">
      <button class="btn" id="resetBtn">重置</button>
      <button class="btn primary" id="demoBtn">▶ 房贷走完全程</button>
    </div>
  </div>
  <div class="lastop" id="lastop"></div>
  <div style="font-size:11px;color:var(--mut2);line-height:1.6;margin-top:6px">图中的利率与存量取近年量级，用于理解机制；实时数值以央行公布为准。</div>
</footer>

<script>
(function(){
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const C = {
  base:"#4d8dff", create:"#34d17a", fiscal:"#f5a623",
  bond:"#a78bfa", shadow:"#22d3ee", cross:"#94a3b8", warn:"#ff7a7a"
};
const KIND_NAME = {
  base:"基础货币", create:"货币创造", fiscal:"财政",
  bond:"债市", shadow:"非银·影子", cross:"跨境"
};

/* ============================ 投放工具 ============================ */
const RATE_CHAIN = [
  { k:"政策利率", n:"7 天逆回购，1.40%",
    d:"央行每天向一级交易商出价。它定的是整条链条的<b>起点价</b>，也是最粗的那一根缰绳。" },
  { ar:"银行之间押着国债互相借钱",
    k:"DR007", n:"银行间 7 天质押式回购利率",
    d:"<b>D</b>＝存款类机构，<b>R</b>＝回购，<b>007</b>＝7 天。银行拿利率债（国债、政金债、地方债）做押品互相借 7 天的钱，按成交量加权算出的利率。押品风险低、对手是银行，几乎没有信用风险——所以它是最干净的「批发价」。" },
  { ar:"银行缺中期资金，发存单去借",
    k:"同业存单", n:"银行发给同业的借条，1 年以内、可转让",
    d:"银行把「我欠你钱」写成一张可流通的凭证，卖给其他银行、货基、理财。它是银行的<b>中期批发成本</b>：比 DR007 长，比贷款短，是政策利率与 LPR 之间的中转站。" },
  { ar:"18 家报价行每月 20 日报一次价",
    k:"LPR", n:"贷款市场报价利率，分 1 年期和 5 年以上",
    d:"报价行在政策利率上加点报出，去掉最高最低后取平均。它是银行给<b>最优质客户</b>的贷款利率；房贷看 5 年以上那一档。" },
  { ar:"银行再按你的资质加一笔风险溢价",
    k:"贷款利率", n:"你实际付的那个数",

function el(tag, attrs, kids){
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  if (kids) kids.forEach(c => c && n.appendChild(c));
  return n;
}

}

  const n = parseInt(h.slice(1), 16);

/* ============================ 交互：聚焦 ============================ */
function setFocus(edgeId, nodeId){
  focusId = edgeId || nodeId || null;
  const keep = new Set();
  if (edgeId) keep.add(edgeId);
  else if (nodeId) (NODE_EDGES[nodeId] || []).forEach(id => keep.add(id));

  svg.querySelectorAll("[data-id]").forEach(n => {
    const isNode = n.classList.contains("node");
    if (!focusId){
      n.classList.remove("dimmed", "dim", "on");
      return;
    }
    const id = n.getAttribute("data-id");
    if (isNode){
      n.classList.remove("dimmed");
      n.classList.toggle("dim", !!edgeId);
    } else {
      n.classList.toggle("dimmed", !keep.has(id));
      n.classList.toggle("on", !!edgeId && keep.has(id));
    }
  });
  svg.querySelectorAll(".node").forEach(n => {
    n.classList.toggle("focus", !!nodeId && n.getAttribute("data-id") === nodeId);
  });
}

function clearFocus(){
  pinned = null;
  focusId = null;
  svg.querySelectorAll("[data-id]").forEach(n => n.classList.remove("dimmed", "dim", "on"));
  svg.querySelectorAll(".node").forEach(n => n.classList.remove("focus"));
}

}

function showNode(n){
  pinned = n.id;

    <button class="backbtn" id="backBtn">← 回到导读</button>
    <div class="pcard">
      <h3><span class="n" style="background:${C[n.tone]}">·</span>${n.title}</h3>

    </div>
    ${n.deep ? n.deep.map(d => `<div class="pcard"><h3>${d.h}</h3>${d.b.map(x => `<div class="deep-p">${x}</div>`).join("")}</div>`).join("") : ""}

      <h3>连到它的箭头</h3>

  const b = $("backBtn"); if (b) b.onclick = () => { clearFocus(); panelHome(); };

/* 节点与箭头的映射 */
const NODE_EDGES = {
  pbc:["e1","e2","e3","e4"],
  bank:["e2","e3","e5","e6","e7","e11","e12","e14","e17"],
  mof:["e4","e8","e9","e10"],
  mkt:["e10","e11","e12","e13"],
  nbfi:["e13","e14","e15","e16"],

  off:["e1","e17"]
};
const NODE_LINKS = NODE_EDGES;

/* ============================ 底部模拟器 ============================ */
const BASE = {M2:300000, B:38000};
let acc = {M2:0, B:0, R:0, G:0, L:0, S:0};
const META = [
  {k:"M2", label:"Δ M2", unit:"亿"},
  {k:"B",  label:"Δ 基础货币", unit:"亿"},
  {k:"R",  label:"Δ 准备金", unit:"亿"},
  {k:"G",  label:"Δ 政府存款", unit:"亿"},
  {k:"L",  label:"Δ 银行贷款", unit:"亿"},
  {k:"S",  label:"Δ 银行持债", unit:"亿"}
];

const OPS = [
  { id:"o1", label:"逆回购 +1000", tone:"up",   edge:"e2", d:{B:1000, R:1000},
    note:"投放准备金。钱停在银行间市场，M2 还不动。" },
  { id:"o2", label:"到期回笼 −1000", tone:"down", edge:"e3", d:{B:-1000, R:-1000},

  { id:"o3", label:"降准 0.5pct", tone:"flat", edge:"e2", d:{},
    note:"基础货币不变、M2 不变：法定准备金转成超额准备金，动的是乘数分母，不是基数。" },
  { id:"o4", label:"放贷 +1000", tone:"up",   edge:"e5", d:{M2:1000, L:1000},
    note:"贷款创造存款。M2 上升，基础货币不动。" },
  { id:"o5", label:"还本 −1000", tone:"down", edge:"e6", d:{M2:-1000, L:-1000},
    note:"贷款与存款同时注销 —— 货币被消灭。" },
  { id:"o6", label:"收税 +1000", tone:"down", edge:"e8", d:{M2:-1000, B:-1000, R:-1000, G:1000},
    note:"M2 与基础货币同时下降。真正的抽水。" },
  { id:"o7", label:"财政支出 +1000", tone:"up", edge:"e9", d:{M2:1000, B:1000, R:1000, G:-1000},
    note:"政府存款变企业存款，准备金回流。真正的放水。" },
  { id:"o8", label:"银行买国债 +1000", tone:"flat", edge:"e11", d:{B:-1000, R:-1000, G:1000, S:1000},
    note:"M2 不变，准备金被抽进国库。发债本身是紧缩的。" },
  { id:"o9", label:"非银买国债 +1000", tone:"down", edge:"e13", d:{M2:-1000, B:-1000, R:-1000, G:1000},
    note:"用的是存量存款，M2 直接少一块。" },
  { id:"o10", label:"化债置换 1000", tone:"flat", edge:"e11", d:{L:-1000, S:1000},
    note:"三段记账：政府发置换债（抽准备金）→ 拨给城投（放回）→ 城投还贷（注销贷款和存款）。净结果 M2 不变、基础货币不变，只有银行资产从贷款换成债券。真正的收缩不在存量，而在「不能再新增隐性债务」这条流量约束上。" },
  { id:"o11", label:"影子银行放贷 +1000", tone:"up", edge:"e15", d:{M2:1000},
    note:"M2 上升，但不占银行表内贷款额度、不缴准备金。绕开了闸门。" },
  { id:"o12", label:"外汇占款 +1000", tone:"up", edge:"e1", d:{M2:1000, B:1000, R:1000},
    note:"M2 与基础货币同时上升 —— 2005–2014 年的主旋律。" },
  { id:"o13", label:"存款搬家 1000", tone:"flat", edge:"e16", d:{},
    note:"M2 总量不变（非银存款也在 M2 里），变的是结构：居民存款 → 同业存款，银行负债更不稳。" }
];

function buildOps(){
  const box = $("ops");
  box.innerHTML = "";
  OPS.forEach(o => {
    const b = document.createElement("button");
    b.className = "op";
    b.dataset.tone = o.tone;
    b.dataset.id = o.id;
    b.textContent = o.label;
    b.onclick = () => applyOp(o);
    box.appendChild(b);
  });
}

function buildMetrics(){
  const box = $("metrics");
  box.innerHTML = META.map(m =>
    `<div class="m"><div class="k">${m.label}</div><div class="v zero" id="mv-${m.k}">0</div></div>`
  ).join("") + `<div class="m"><div class="k">货币乘数 M2/B</div><div class="v" id="mv-MUL">7.89</div></div>`;
}

function fmt(v){
  if (v === 0) return "0";
  const s = Math.abs(v).toLocaleString("en-US");
  return (v > 0 ? "+" : "−") + s;
}
function refreshMetrics(){
  META.forEach(m => {
    const n = $("mv-" + m.k);
    const v = acc[m.k];
    n.textContent = fmt(v);
    n.className = "v " + (v > 0 ? "up" : v < 0 ? "down" : "zero");
  });
  const m2 = BASE.M2 + acc.M2, b = BASE.B + acc.B;
  const mul = b > 0 ? (m2 / b) : 0;
  const el2 = $("mv-MUL");
  el2.textContent = mul.toFixed(2);
  el2.className = "v " + (mul > 7.895 ? "up" : mul < 7.885 ? "down" : "");
}

function flashEdge(id){
  const g = svg.querySelector(`.edge[data-id="${id}"]`);
  if (!g) return;
  g.classList.add("on");
  setTimeout(() => g.classList.remove("on"), 1600);
}

function applyOp(o){
  Object.keys(acc).forEach(k => { acc[k] += (o.d[k] || 0); });
  refreshMetrics();
  flashEdge(o.edge);
  const e = EDGES.find(x => x.id === o.edge) || EDGES[0];
  panel.innerHTML = `
    <button class="backbtn" id="backBtn">← 回到导读</button>
    <div class="pcard">
      <h3><span class="n" style="background:${C[e.kind]}">${o.tone === "down" ? "−" : o.tone === "up" ? "＋" : "·"}</span>${o.label}</h3>
      <div class="flowline" style="color:${C[e.kind]}">${e.title}</div>
      <div class="impacts">
        ${Object.keys(o.d).map(k => {
          const v = o.d[k];
          const label = {M2:"M2",B:"基础货币",R:"准备金",G:"政府存款",L:"银行贷款",S:"银行持债"}[k];
          return `<span class="imp ${v>0?"up":"down"}">${label} ${fmt(v)}</span>`;
        }).join("") || `<span class="imp flat">总量指标不变</span>`}
      </div>
      <div class="one">${o.note}</div>
    </div>`;
  const b = $("backBtn"); if (b) b.onclick = () => { clearFocus(); panelHome(); };
  $("lastop").innerHTML = `最近一步：<b>${o.label}</b> · M2 ${fmt(o.d.M2 || 0)} · 基础货币 ${fmt(o.d.B || 0)}`;
}

/* ============================ 房贷演示 ============================ */
const DEMO = [
  { edge:"e2", text:"央行逆回购，投放 1 亿元准备金给 A 银行。<b>水进了银行间市场</b>，还没到实体。" },
  { edge:"e5", text:"居民甲申请 500 万房贷。银行记账：资产＋500 万贷款，负债＋500 万存款。<b>货币在这一瞬间被创造。</b>" },
  { node:"bank", text:"甲把钱付给开发商乙，A 银行的准备金划给 B 银行。<b>货币在体系内转移，总量不变。</b>" },
  { node:"real", text:"乙付工程款给建筑商丙、发工资给工人丁。<b>钱沿产业链继续转手</b>，每转一次都在不同银行间划准备金。" },
  { edge:"e16", text:"丙、丁把钱存起来或买理财。<b>存款搬家，M2 结构变了，总量未必变。</b>" },
  { edge:"e6", text:"甲每月还本付息。还本同时注销一笔贷款和一笔存款——<b>货币被消灭。</b>" },
  { edge:"e8", text:"政府向乙收土地增值税，钱进国库——<b>抽水</b>；再把专项资金拨下去修路——<b>放水</b>。" }
];

let demoBox = null;
function startDemo(){
  stopDemo();
  demo.running = true;
  demo.i = 0;
  if (!demoBox){
    demoBox = document.createElement("div");
    demoBox.className = "lastop";
    demoBox.style.cssText = "margin-top:8px;padding:9px 12px;border:1px solid rgba(77,141,255,.3);border-radius:9px;background:rgba(77,141,255,.07);color:#dfe8f7;font-size:12.5px;line-height:1.7";
    $("lastop").replaceWith(demoBox);
    demoBox.id = "lastop";
  }
  $("demoBtn").textContent = "⏹ 停止演示";
  stepDemo();
  demo.timer = setInterval(stepDemo, 2600);
}
function stepDemo(){
  if (demo.i >= DEMO.length){ stopDemo(); return; }
  const s = DEMO[demo.i];
  clearFocus();
  if (s.edge){
    const g = svg.querySelector(`.edge[data-id="${s.edge}"]`);
    if (g) g.classList.add("on");
    setFocus(s.edge, null);
    // 去掉自加的 on 类冲突
    if (g) g.classList.add("on");
  } else if (s.node){
    const g = svg.querySelector(`.node[data-id="${s.node}"]`);
    if (g) g.classList.add("focus");
  }
  demoBox.innerHTML = `<span style="color:${C.base};font-weight:700">第 ${demo.i+1}/${DEMO.length} 步</span>　${s.text}`;
  demo.i++;
}
function stopDemo(){
  if (demo.timer) clearInterval(demo.timer);
  demo.timer = null;
  demo.running = false;
  $("demoBtn").textContent = "▶ 房贷走完全程";
  clearFocus();
}

/* ============================ 筛选 ============================ */
const CHIPS = [
  {k:"all",   t:"全部"},
  {k:"base",  t:"基础货币"},
  {k:"create",t:"货币创造"},
  {k:"fiscal",t:"财政"},
  {k:"bond",  t:"债市"},
  {k:"shadow",t:"非银·影子"},
  {k:"cross", t:"跨境"}
];
function buildChips(){
  const box = $("chips");
  CHIPS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c.k === "all" ? " on" : "");
    b.dataset.k = c.k;
    b.innerHTML = (c.k !== "all" ? `<span class="dot" style="background:${C[c.k]}"></span>` : "") + c.t;
    b.onclick = () => applyFilter(c.k);
    box.appendChild(b);
  });
}
const FILTER_NOTE = {
  base:"基础货币这一层只和银行打交道。钱在这里只决定「有没有水」，还不决定「水去哪」。",
  create:"货币创造发生在银行和实体之间：放贷记出一笔存款，还本注销一笔存款。",
  fiscal:"财政是第二个水位调节器：收税与发债抽水，支出放水。看「支出进度」，不看发行规模。",
  bond:"债市同时干三件事：融资、抵押品、定价。只有一级认购会动货币；二级买卖和回购只动周转。",
  shadow:"非银不直接创造货币，但它能把银行的资金搬到监管看不到的表外去放贷——那时全系统的存款货币是增加的。",
  cross:"外汇占款是「资产是外汇」的货币创造。这条管子的粗细，取决于企业和居民愿不愿意结汇。"
};
function applyFilter(k){
  currentKind = k;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.k === k));
  clearFocus();
  EDGES.forEach(e => {
    const show = k === "all" || e.kind === k;
    ["edges","labels","badges"].forEach(layer => {
      const g = svg.querySelector(`#${layer} [data-id="${e.id}"]`);
      if (g) g.classList.toggle("hidden", !show);
    });
  });
  if (k !== "all"){
    panel.innerHTML = `<div class="pcard"><h3>${KIND_NAME[k]}</h3>
      <p>${FILTER_NOTE[k] || ""}</p>
      <p style="color:var(--mut2);font-size:12px">点图上的箭头看分录，点「全部」回到总览。</p></div>`;
  } else {
    panelHome();
  }
}

/* ============================ 初始化 ============================ */
function init(){
  buildDefs();
  buildGrid();
  buildAnnotation();
  buildToolbox();
  buildEdges();
  gNodes = el("g", {id:"nodes"});
  buildNodes();
  buildBadges();

  svg.querySelectorAll(".edge[data-id]").forEach(g => {
    const id = g.getAttribute("data-id");
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      showEdge(EDGES.find(e => e.id === id));
    });
  });

  svg.addEventListener("click", ev => {
    if (ev.target === svg) { clearFocus(); panelHome(); }
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape"){ stopDemo(); clearFocus(); panelHome(); }
  });

  buildChips();
  buildOps();
  buildMetrics();
  refreshMetrics();
  panelHome();

  $("resetBtn").onclick = () => {
    acc = {M2:0,B:0,R:0,G:0,L:0,S:0};
    refreshMetrics();
    $("lastop").innerHTML = "已重置。所有指标回到 0 变动。";
    stopDemo();
  };
  $("demoBtn").onclick = () => { demo.running ? stopDemo() : startDemo(); };
}
init();
})();
